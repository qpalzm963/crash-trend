[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crash-trend"
version = "2.7.0.dev0"
description = "Android/iOS crash and ANR tracking, analysis, and lifecycle pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyYAML>=6.0",
    "google-cloud-bigquery>=3.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["crash_trend"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",  # Line too long (preserving long HTML/JS/SQL literals)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E402",  # Module level import not at top of file (sys.path.insert in test files)
]
"crash_trend/build_dashboard.py" = [
    "E402",  # sys.path.insert before relative module imports
]
"crash_trend/lifecycle.py" = [
    "E402",  # sys.path.insert before relative module imports
]
"crash_trend/release_gate.py" = [
    "E402",  # sys.path.insert before relative module imports
]

[tool.mypy]
python_version = "3.11"
files = [
    "crash_trend/schema_v2.py",
    "crash_trend/authority_store.py",
    "crash_trend/catalog",
    "crash_trend/gate",
    "crash_trend/release_gate.py",
]
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
