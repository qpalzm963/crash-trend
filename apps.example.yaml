# crash-trend 設定範例 —— 複製為 apps.yaml 後填入實值
# 支援 Dashboard V2.7 多 App 管理、Data Source Profile、AI 優先級分析、Release Regression Gate 與 Google Chat 通知
#
# 安全守則：
# 1. 嚴禁在 apps.yaml 寫入任何明文 API Key、Service Account 私鑰或 Webhook URL
# 2. Google Chat Webhook URL 一律透過環境變數注入（預設讀取 GOOGLE_CHAT_WEBHOOK_URL）
# 3. AI API Key 一律透過環境變數（GEMINI_API_KEY, OPENROUTER_API_KEY）注入
# 4. BigQuery 服務帳號請使用最小權限（唯讀）角色，嚴禁使用 Owner/Editor 權限

credentials:
  # BigQuery 服務帳號 json 路徑（用 scripts/create_sa.sh 產生；筆電與伺服器共用同一把）
  # 此為全域預設值，可被 apps.<app_id>.bq_service_account 覆寫（見 shop_app / rider_app 範例）
  # 特殊值 adc / none / 空值 → 改用 Application Default Credentials（本機先跑
  #   `gcloud auth application-default login`，不落地任何金鑰檔）
  # 指定了路徑但檔案不存在時，Crashlytics 與 Sessions 兩條抓取路徑都會以明確錯誤失敗，
  #   不會靜默退回 ADC（避免用比預期弱的身分抓到不完整的資料）
  bq_service_account: ~/.config/crash-trend/sa.json

bigquery:
  # 單一查詢的等待上限（秒；選填。Dashboard V2.8 - Issue #66）
  # 沒設時為 300 秒。用途不是調效能，而是「GCP 出現 transient 延遲時 pipeline 不要
  #   無限期卡住」：逾時會同時讓 BigQuery 端終止 job（job_timeout_ms）並取消該 job，
  #   而那一支查詢會變成明確的錯誤（該期間 KPI 為 status: "error"），
  #   絕不會被當成「這段時間沒有崩潰」。
  # 可被 apps.<app_id>.bq_query_timeout_sec 覆寫；環境變數
  #   CRASH_TREND_BQ_QUERY_TIMEOUT 優先於兩者（CI / 一次性排查用）。
  # 特殊值 0 / off / none / false → 不設上限（明確選擇；寫壞的值會直接報錯，不會靜默
  #   退回預設）
  # 注意：`query_timeout_sec:` 留空**不是**「不設上限」，而是「這一層沒設」（會往下一層
  #   找：app → 全域 → 預設 300 秒）。要取消上限必須明確寫 0 / off，
  #   否則一個空行就能悄悄關掉這道防護。
  query_timeout_sec: 300

ai:
  # AI Task Router 設定 (選填；Dashboard V2.4 - Issue #35)
  # 支援 auto（deep_analysis 給 Gemini，lightweight 給 OpenRouter 免費模型）、gemini_only、openrouter_only
  mode: auto                                  # auto（預設）| gemini_only | openrouter_only
  primary:
    provider: gemini                          # 主力 provider（預設 gemini）
    model: gemini-3.8-flash                   # 主力模型
    # api_key: "..."                          # 選填；未填則讀取 GEMINI_API_KEY 或 GEMINI_KEY_URL
  lightweight:
    provider: openrouter                      # 輕量 worker（預設 openrouter）
    model: openrouter/free                    # 免費模型（限定 openrouter/free 或 :free 模型）
    # api_key: "..."                          # 選填；未填則讀取 OPENROUTER_API_KEY
    # zdr: true                               # Zero Data Retention 政策守護（預設 true）
  allow_paid_models: false                    # 禁止偷偷使用付費模型（預設 false，保護錢包）
  privacy:
    include_source_snippet: true              # 隱私保護：是否放本地程式碼片段進 prompt（預設 true）
  fallback:
    enabled: false                            # 遇 transient failure (429/500/503) 是否自動容錯切換（預設 false）

apps:
  shop_app:                               # 範例 1：完整模式 (Crashlytics + Sessions)
    display_name: 購物商城 App             # 儀表板與報表顯示名稱
    firebase_project: shop-app-12345      # Firebase 專案 ID（BigQuery 專案同名或關聯專案）
    bq_service_account: ~/.config/crash-trend/shop-app-sa.json  # 選填：此 App 專屬 SA，覆寫全域 credentials.bq_service_account
    bq_query_timeout_sec: 300             # 選填：此 App 專屬查詢逾時上限（秒），覆寫全域 bigquery.query_timeout_sec
                                          # （Crashlytics 與 Sessions 兩條路徑共用同一把，不會分岔）
    data_sources:                         # 資料源設定 (選填，可細部控制)
      crashlytics_bigquery: true          # 預設 true
      sessions: true                      # 啟用 Firebase Sessions 計算 Crash-free 率
      mcp:                                # MCP 設定 (可寫物件或字串 off / manual / weekly)
        mode: manual                      # manual（手動刷新，預設）/ weekly（排程自動補強）/ off（完全停用）
        max_age_days: 7                   # 快取新鮮度上限天數（預設 7）
    bq_dataset: firebase_crashlytics      # Crashlytics BigQuery dataset（預設值通常免改）
    sessions_dataset: firebase_sessions   # Firebase Sessions BigQuery dataset (sessions: true 時使用)
    package_name: com.example.shop        # Android Package Name（多 App 共享 dataset 時精準過濾表）
    bundle_id: com.example.shop.ios       # iOS Bundle Identifier（選填）
    source_repo: ~/develop/shop_app       # 原始碼本地路徑（AI 與 Blame Frame 原始碼對映；無則留空）
    platforms:                            # 支援平台
      - android
      - ios
    core_paths:                           # 核心業務關鍵字（優先級評分加權；可填檔名、路徑或模組）
      - checkout
      - payment
      - CartActivity
      - 付款
    custom_keys:                          # App 埋設之 Crashlytics Custom Keys 監控清單
      - user_tier
      - network_type
    release_gate:                         # 版本品質退化閘門設定 (選填；Dashboard V2.7 - Issue #57)
      enabled: true                       # 是否啟用品質退化評估（預設 true）
      min_sessions: 1000                  # 判定門檻之最小工作階段數（低於此數標記為 insufficient_data）
      thresholds:
        crash_rate_change_pct: { warn: 0.10, fail: 0.25 }   # 崩潰率上升幅度（+10% 預警, +25% 失敗阻擋）
        crash_free_users_drop: { warn: 0.005, fail: 0.015 } # 無崩潰用戶率下降（0.5% 預警, 1.5% 失敗阻擋）
        fatal_rate_change_pct: { warn: 0.10, fail: 0.25 }   # Fatal 率上升幅度
        anr_rate_change_pct: { warn: 0.10, fail: 0.25 }     # ANR 率上升幅度
        regressed_issues_count: { warn: 1, fail: 3 }        # 復發問題數門檻
        introduced_issues_count: { warn: 5, fail: 10 }      # 新引入問題數門檻
    release_alerts:                       # 版本品質通知設定 (選填；Dashboard V2.7 - Issue #59)
      enabled: true                       # 是否啟用通知（預設 true）
      provider: google_chat               # 通知管道：google_chat / slack / microsoft_teams / webhook
                                          #   （別名：teams, msteams, http, custom）
      notify_on:                          # 觸發通知之狀態清單
        - fail
        - warn
      cooldown_minutes: 360               # 同一版本相同異常冷卻分鐘數（預設 360 分鐘 = 6 小時）
      resend_on_status_change: true       # 狀態變更時（如 WARN 轉 FAIL）忽略冷卻立即重新發送
      resend_on_new_reason: true          # 出現新退化原因時忽略冷卻立即發送
      notify_recovery: true               # 前次異常後若指標復原至 PASS，發送復原通知
      google_chat:                        # provider 專屬設定：子區塊名稱 == provider 名稱
        webhook_env: GOOGLE_CHAT_WEBHOOK_URL # Webhook URL 環境變數名稱（嚴禁在設定檔寫死 URL 與 Token）
        use_threads: true                 # 是否使用版本專屬 threadKey 收攏通知（僅 Google Chat 支援）
      # 其他通道的設定方式相同，只要把子區塊改成該 provider 的名稱。未指定 webhook_env
      # 時各通道有自己的預設環境變數，不會沿用 Google Chat 的那一個：
      #   slack:            webhook_env: SLACK_WEBHOOK_URL      # Slack Incoming Webhook（不支援 thread）
      #   microsoft_teams:  webhook_env: MS_TEAMS_WEBHOOK_URL   # O365 connector 或 Power Automate 皆可
      #   webhook:          webhook_env: ALERT_WEBHOOK_URL      # 自家 HTTP 接收端
      # `webhook` 通道送出的是 AlertMessage 的**完整結構化欄位**（app_id / platform /
      #   target_version / gate_status / regression_reasons / decision_action /
      #   recommendation / dashboard_url / text ...），而非排版後的文字，方便接收端自行
      #   轉派或開單。所有通道共用同一套投遞語意：2xx 視為成功、429 與 5xx 有限次數
      #   指數退避重試、其餘 4xx 立刻失敗，且錯誤訊息一律遮蔽 webhook URL。

  rider_app:                              # 範例 2：Crashlytics-only 模式 (推薦：輕量、不佔 Sessions 儲存)
    display_name: 外送司機端
    firebase_project: rider-app-67890
    bq_service_account: adc               # 選填：此 App 改用 ADC（本機開發常用），覆寫全域 SA
    data_sources:
      crashlytics_bigquery: true          # 啟用 Crashlytics 匯出 (錯誤排行、堆疊、每日趨勢、受影響人數)
      sessions: false                     # 停用 Sessions 匯出 (不查詢 firebase_sessions，免額外儲存)
      mcp: off                            # 完全關閉 MCP，純靠 BigQuery ＋ 啟發式分析
    bq_dataset: firebase_crashlytics
    package_name: com.example.rider
    source_repo: ~/develop/rider_app
    platforms:
      - android
    core_paths:
      - navigation
      - dispatch
      - order_accept
    custom_keys:
      - vehicle_type
    release_gate:                         # Crashlytics-only 模式可自由選擇是否啟用 Gate
      enabled: false                      # 若停用，管線將產生 enabled: false 之非阻擋產物，不評估指標

