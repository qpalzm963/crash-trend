# crash-trend 設定範例 —— 複製為 apps.yaml 後填入實值
# 支援 Dashboard V2 多 App 管理、Data Source Profile (Crashlytics-only / Full Sessions) 與 AI 優先級分析

credentials:
  # BigQuery 服務帳號 json 路徑（用 scripts/create_sa.sh 產生；筆電與伺服器共用同一把）
  bq_service_account: ~/.config/crash-trend/sa.json

ai:
  # AI Task Router 設定 (選填；Dashboard V2.4 - Issue #35)
  # 支援 auto（deep_analysis 給 Gemini，lightweight 給 OpenRouter 免費模型）、gemini_only、openrouter_only
  mode: auto                                  # auto（預設）| gemini_only | openrouter_only
  primary:
    provider: gemini                          # 主力 provider（預設 gemini）
    model: gemini-2.5-flash                   # 主力模型
    # api_key: "..."                          # 選填；未填則讀取 GEMINI_API_KEY 或 GEMINI_KEY_URL
  lightweight:
    provider: openrouter                      # 輕量 worker（預設 openrouter）
    model: openrouter/free                    # 免費模型（限定 openrouter/free 或 :free 模型）
    # api_key: "..."                          # 選填；未填則讀取 OPENROUTER_API_KEY
    # zdr: true                               # Zero Data Retention 政策守護（預設 true）
  allow_paid_models: false                    # 禁止偷偷使用付費模型（預設 false，保護錢包）
  privacy:
    include_source_snippet: true              # 隱私保護：是否放本地程式碼片段進 prompt（預設 true）
  fallback:
    enabled: false                            # 遇 transient failure (429/500/503) 是否自動容錯切換（預設 false）

apps:
  shop_app:                               # 範例 1：完整模式 (Crashlytics + Sessions)
    display_name: 購物商城 App             # 儀表板與報表顯示名稱
    firebase_project: shop-app-12345      # Firebase 專案 ID（BigQuery 專案同名或關聯專案）
    data_sources:                         # 資料源設定 (選填，可細部控制)
      crashlytics_bigquery: true          # 預設 true
      sessions: true                      # 啟用 Firebase Sessions 計算 Crash-free 率
      mcp:                                # MCP 設定 (可寫物件或字串 off / manual / weekly)
        mode: manual                      # manual（手動刷新，預設）/ weekly（排程自動補強）/ off（完全停用）
        max_age_days: 7                   # 快取新鮮度上限天數（預設 7）
    bq_dataset: firebase_crashlytics      # Crashlytics BigQuery dataset（預設值通常免改）
    sessions_dataset: firebase_sessions   # Firebase Sessions BigQuery dataset (sessions: true 時使用)
    package_name: com.example.shop        # Android Package Name（多 App 共享 dataset 時精準過濾表）
    bundle_id: com.example.shop.ios       # iOS Bundle Identifier（選填）
    source_repo: ~/develop/shop_app       # 原始碼本地路徑（AI 與 Blame Frame 原始碼對映；無則留空）
    platforms:                            # 支援平台
      - android
      - ios
    core_paths:                           # 核心業務關鍵字（優先級評分加權；可填檔名、路徑或模組）
      - checkout
      - payment
      - CartActivity
      - 付款
    custom_keys:                          # App 埋設之 Crashlytics Custom Keys 監控清單
      - user_tier
      - network_type

  rider_app:                              # 範例 2：Crashlytics-only 模式 (推薦：輕量、不佔 Sessions 儲存)
    display_name: 外送司機端
    firebase_project: rider-app-67890
    data_sources:
      crashlytics_bigquery: true          # 啟用 Crashlytics 匯出 (錯誤排行、堆疊、每日趨勢、受影響人數)
      sessions: false                     # 停用 Sessions 匯出 (不查詢 firebase_sessions，免額外儲存)
      mcp: off                            # 完全關閉 MCP，純靠 BigQuery ＋ 啟發式分析
    bq_dataset: firebase_crashlytics
    package_name: com.example.rider
    source_repo: ~/develop/rider_app
    platforms:
      - android
    core_paths:
      - navigation
      - dispatch
      - order_accept
    custom_keys:
      - vehicle_type
