name: Regenerate Python lockfile

on:
  push:
    branches: [ "chore/issue-55-python-packaging-quality-gates" ]
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/issue-55-python-packaging-quality-gates
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Regenerate lockfile and runtime requirements
        run: |
          uv lock
          uv export --no-dev --locked --no-emit-project --no-hashes --no-header -o requirements.txt

      - name: Commit generated files
        run: |
          if git diff --quiet -- uv.lock requirements.txt; then
            echo "No generated dependency changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt
          git commit -m "build: regenerate lock for Python 3.11-3.12 support"
          git push
